[project]
name = "game-stats"
version = "0.1.0"
description = "Local stats backend for Dungeon Escape: stores runs and events in SQLite and serves a web UI."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
game-stats = "game_stats.main:run"
game-stats-seed = "game_stats.seed:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["game_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
